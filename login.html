<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Google font["Titillium Web"] -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Amatic+SC:wght@400;700&family=Archivo+Black&family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=BBH+Sans+Hegarty&family=Bree+Serif&family=Exo:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans+Caption:wght@400;700&family=Pacifico&family=Passion+One:wght@400;700;900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Righteous&family=Roboto:ital,wght@0,100..900;1,100..900&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
        rel="stylesheet">
    <!-- font Awesome -->
    <link rel="stylesheet" href="css/all.min.css">
    <!-- bootstrap css -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- main css -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section>
        <div class="container pt-5">
            <div class="box text-center w-75 mx-auto ">
                <h1 class="text-info pt-5">Smart Login System</h1>
                <form action="" class="d-flex flex-column px-5">
                    <input type="email" placeholder="Enter Your email" class="form-control my-2" id="email-id">
                    <input type="password" placeholder="Enter Your password" class="form-control my-2" id="password-id">
                    <p class="my-3 d-none" id="Message"></p>
                    <button type="button" class="btn btn-outline-info my-4" id="Login">Login</button>
                    <p class="text-white pb-5">Don’t have an account? <span><a href="signup.html"
                                class="text-white text-decoration-none">Sign Up</a></span></p>
                </form>
            </div>
        </div>
    </section>
    <!-- bootstrap js -->
    <script src="js\bootstrap.bundle.min.js"></script>
    <!-- main js -->
    <script src="js\main.js"></script>
</body>

</html>
